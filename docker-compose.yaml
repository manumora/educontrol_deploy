services:
  db:
    container_name: educontrol_postgres
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - educontrol-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: educontrol_redis
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data
    networks:
      - educontrol-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: educontrol_backend
    image: manumora/educontrol-backend:latest
    restart: always
    volumes:
      - ./backend/staticfiles:/app/backend/staticfiles
      - ./backend/media:/app/backend/media
      - ./backend/import_uploads:/app/backend/import_uploads
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SECURE_SSL_REDIRECT: "False"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_URL: ${REDIS_URL}
      AUTH_LDAP_SERVER_URI: ${AUTH_LDAP_SERVER}
      AUTH_LDAP_BIND_PASSWORD: ${AUTH_LDAP_PASSWORD}
      # Módulo de impresión centralizada (opcional, ver servicio `cups`).
      CUPS_CONTROL_TOKEN: ${CUPS_CONTROL_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - educontrol-network

  frontend:
    container_name: educontrol_frontend
    image: manumora/educontrol-frontend:latest
    restart: always
    ports:
      - "${EDUCONTROL_PORT}:443"
      - "8443:8443"
    environment:
      MCP_CLIENT_FIXED_IP: ${MCP_CLIENT_FIXED_IP:-}
    volumes:
      - ./frontend/staticfiles:/static_files
      - ./backend/media:/media_files
      - ./frontend/letsencrypt:/etc/letsencrypt
      - ./frontend/certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - educontrol-network

  mcp_server:
    container_name: educontrol_mcp_server
    image: manumora/educontrol-mcp-server:latest
    restart: always
    environment:
      EDUCONTROL_WS_BASE_URL: ws://backend:8000
      EDUCONTROL_API_BASE_URL: http://backend:8000/api
      EDUCONTROL_API_TOKEN: ${EDUCONTROL_API_TOKEN}
      EDUCONTROL_MCP_GATEWAY_TOKEN: ${EDUCONTROL_MCP_GATEWAY_TOKEN}
    depends_on:
      backend:
        condition: service_started
    networks:
      - educontrol-network

  celery_worker:
    container_name: educontrol_celery_worker
    image: manumora/educontrol-backend:latest
    restart: always
    network_mode: host
    volumes:
      - ./backend/import_uploads:/app/backend/import_uploads
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SECURE_SSL_REDIRECT: "False"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST_LOCAL:-127.0.0.1}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_URL: ${REDIS_URL_LOCAL:-redis://127.0.0.1:6379/0}
      AUTH_LDAP_SERVER_URI: ${AUTH_LDAP_SERVER}
      AUTH_LDAP_BIND_PASSWORD: ${AUTH_LDAP_PASSWORD}
      # Conciliación periódica de estados de impresión (red del host: cups-control en loopback).
      CUPS_CONTROL_URL: http://127.0.0.1:6310
      CUPS_CONTROL_TOKEN: ${CUPS_CONTROL_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["celery", "-A", "backend", "worker", "-l", "info", "-n", "worker@%h", "--concurrency=4"]

  celery_beat:
    container_name: educontrol_celery_beat
    image: manumora/educontrol-backend:latest
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SECURE_SSL_REDIRECT: "False"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_URL: ${REDIS_URL}
    networks:
      - educontrol-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["celery", "-A", "backend", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]

  # Servidor CUPS de impresión centralizada. Opcional: solo arranca con
  # `docker compose --profile printing up -d`. Usa la red del host para escuchar
  # en el 631 y ver la IP real de cada cliente.
  cups:
    container_name: educontrol_cups
    image: manumora/educontrol-cups:latest
    profiles: ["printing"]
    restart: always
    network_mode: host
    volumes:
      - ./cups_data/etc:/etc/cups
      - ./cups_data/spool:/var/spool/cups
      - ./cups_data/log:/var/log/cups
    environment:
      # La API se llama por loopback: https://127.0.0.1:$EDUCONTROL_PORT/api
      EDUCONTROL_PORT: ${EDUCONTROL_PORT:-}
      # Token del usuario educontrol-print (Configuración > Tokens API).
      EDUCONTROL_PRINT_TOKEN: ${EDUCONTROL_PRINT_TOKEN:-}
      CUPS_CONTROL_TOKEN: ${CUPS_CONTROL_TOKEN:-}
      # Usuario de la interfaz web de CUPS (/admin); el script de instalación genera la contraseña.
      CUPS_ADMIN_USER: ${CUPS_ADMIN_USER:-}
      CUPS_ADMIN_PASSWORD: ${CUPS_ADMIN_PASSWORD:-}
    depends_on:
      backend:
        condition: service_started

networks:
  educontrol-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24